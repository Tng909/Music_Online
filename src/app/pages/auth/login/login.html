<div class="min-h-full flex flex-col items-center px-4 py-8">
  <!-- Logo -->
  <a routerLink="/" class="mb-6" title="Back to home">
    <img src="Image/logo-music.svg" alt="MusicOnline logo"
      class="w-12 h-12 rounded-full hover:scale-105 transition" />
  </a>

  <div class="w-full max-w-[465px]">
    <h1 class="text-4xl sm:text-5xl font-black tracking-tight leading-[1.1] text-balance mb-8">
      Welcome back
    </h1>

    <form (ngSubmit)="submit()" class="flex flex-col gap-4">
      <label for="login-email" class="text-sm font-bold">Email</label>
      <input
        id="login-email"
        name="email"
        type="email"
        required
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        placeholder="name@domain.com"
        class="h-12 rounded-[4px] border border-[#727272] bg-black px-4 text-base text-white placeholder:text-[#a7a7a7] outline-none focus:border-white"
      />
      <label for="login-password" class="text-sm font-bold">Password</label>
      <input
        id="login-password"
        name="password"
        type="password"
        required
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        placeholder="Your password"
        class="h-12 rounded-[4px] border border-[#727272] bg-black px-4 text-base text-white placeholder:text-[#a7a7a7] outline-none focus:border-white"
      />
      @if (error()) {
        <p class="text-sm text-[#f37c7c]">{{ error() }}</p>
      }
      <button type="submit" [disabled]="auth.busy()"
        class="h-12 rounded-full bg-[#1ed760] hover:bg-[#1fdf64] hover:scale-[1.02] transition text-black text-base font-bold disabled:opacity-60 disabled:hover:scale-100">
        {{ auth.busy() ? 'Please wait…' : 'Log in' }}
      </button>
    </form>

    <div class="text-center mt-12 mb-6">
      <p class="text-[#b3b3b3] text-base">Don't have an account?</p>
      <a routerLink="/signup" class="inline-block mt-4 text-base font-bold hover:underline">Sign up</a>
    </div>
  </div>
</div>
