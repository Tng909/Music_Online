<footer class="h-[88px] shrink-0 bg-black border-t border-white/10 px-4 flex items-center justify-between gap-4">
  <!-- Left: track info -->
  <div class="flex items-center gap-3 w-[30%] min-w-0">
    @if (track(); as t) {
      @if (t.coverUrl; as url) {
        <img [src]="url" [alt]="t.title" class="w-14 h-14 rounded-md object-cover shrink-0" />
      } @else {
        <div [class]="'w-14 h-14 rounded-md flex items-center justify-center text-2xl shrink-0 bg-gradient-to-br ' + t.gradient">
          {{ t.emoji }}
        </div>
      }
      <div class="min-w-0 hidden xs:block sm:block">
        <p class="text-sm font-medium text-white truncate hover:underline cursor-pointer">{{ t.title }}</p>
        <p class="text-xs text-[#b3b3b3] truncate"><app-artist-links [credit]="t.artist" /></p>
      </div>
      <button (click)="player.toggleLike(t.id)" class="ml-1 shrink-0" [title]="liked() ? 'Remove from Liked Songs' : 'Add to Liked Songs'">
        @if (liked()) {
          <svg viewBox="0 0 24 24" class="w-4 h-4 text-[#1ed760]" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        } @else {
          <svg viewBox="0 0 24 24" class="w-4 h-4 text-[#b3b3b3] hover:text-white" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        }
      </button>
      <button (click)="downloadCurrent()" title="Download this song to your device"
        [disabled]="!downloadable() || downloading()"
        class="ml-1 shrink-0 disabled:opacity-40">
        @if (downloading()) {
          <svg viewBox="0 0 24 24" class="w-4 h-4 text-[#b3b3b3] animate-spin" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" d="M12 3a9 9 0 1 0 9 9" /></svg>
        } @else if (downloaded()) {
          <svg viewBox="0 0 24 24" class="w-4 h-4 text-[#1ed760]" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
        } @else if (downloadable()) {
          <svg viewBox="0 0 24 24" class="w-4 h-4 text-[#b3b3b3] hover:text-white" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 19h16" /></svg>
        } @else {
          <svg viewBox="0 0 24 24" class="w-4 h-4 text-[#535353]" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 19h16" /></svg>
        }
      </button>
    } @else {
      <div class="w-14 h-14 rounded-md bg-white/10 shrink-0 flex items-center justify-center text-[#b3b3b3]">♪</div>
      <div>
        <p class="text-sm text-white">Pick a song</p>
        <p class="text-xs text-[#b3b3b3]">Press play anywhere</p>
      </div>
    }
  </div>

  <!-- Center: synced lyric + controls + progress -->
  <div class="flex flex-col items-center gap-1.5 flex-1 max-w-[720px]">
    @if (currentLyricLine(); as line) {
      <p class="w-full text-sm font-medium text-white text-center truncate">{{ line.text }}</p>
    }
    <div class="flex items-center gap-4 sm:gap-6">
      <button (click)="player.toggleShuffle()" [title]="'Shuffle: ' + (isShuffled() ? 'on' : 'off')"
        [class]="isShuffled() ? 'text-[#1ed760]' : 'text-[#b3b3b3] hover:text-white'"
        class="transition relative">
        <svg viewBox="0 0 24 24" class="w-4 h-4" fill="currentColor"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        @if (isShuffled()) { <span class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-[#1ed760]"></span> }
      </button>
      <button (click)="player.prev()" title="Previous" aria-label="Previous"
        [disabled]="!track()"
        class="text-[#c4c4c4] hover:text-white active:text-white transition hover:scale-105 active:scale-95 disabled:opacity-40 disabled:hover:text-[#c4c4c4] disabled:hover:scale-100">
        <svg viewBox="0 0 24 24" class="w-[22px] h-[22px]" fill="currentColor"><path d="M5.5 4h2.2v16H5.5V4zm13.2 0v16L8.2 12l10.5-8z"/></svg>
      </button>
      <button (click)="player.toggle()" title="Play / Pause" aria-label="Play or pause"
        [disabled]="!track()"
        class="w-9 h-9 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 transition disabled:opacity-40 disabled:hover:scale-100">
        @if (isPlaying()) {
          <svg viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        } @else {
          <svg viewBox="0 0 24 24" class="w-5 h-5 translate-x-[1px]" fill="currentColor"><path d="M8 5.14v14l11-7-11-7z"/></svg>
        }
      </button>
      <button (click)="player.next()" title="Next" aria-label="Next"
        [disabled]="!track()"
        class="text-[#c4c4c4] hover:text-white active:text-white transition hover:scale-105 active:scale-95 disabled:opacity-40 disabled:hover:text-[#c4c4c4] disabled:hover:scale-100">
        <svg viewBox="0 0 24 24" class="w-[22px] h-[22px]" fill="currentColor"><path d="M16.3 4h2.2v16h-2.2V4zM5.3 4v16l10.5-8L5.3 4z"/></svg>
      </button>
      <button (click)="player.cycleRepeat()" [title]="repeatTitle()" aria-label="Cycle repeat mode"
        [class]="repeatMode() !== 'off' ? 'text-[#1ed760]' : 'text-[#b3b3b3] hover:text-white'"
        class="transition relative">
        @if (repeatMode() === 'one') {
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-7.5-5h3v1.5H14v-4c0-.83-.67-1.5-1.5-1.5H9v1.5h3.5V12H9.5z"/></svg>
          <span class="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-[#1ed760] text-black text-[8px] font-extrabold flex items-center justify-center">1</span>
        } @else {
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        }
        @if (repeatMode() !== 'off') { <span class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-[#1ed760]"></span> }
      </button>
    </div>
    <div class="w-full flex items-center gap-2 text-[11px] text-[#b3b3b3]">
      <span class="w-10 text-right tabular-nums">{{ elapsed() }}</span>
      <input type="range" min="0" max="100" step="0.5" [value]="sliderPercent()"
        [style.background]="sliderFill()"
        (pointerdown)="onSeekStart($event)" (input)="onSeeking($event)" (change)="onSeekEnd($event)"
        class="spot-range spot-progress flex-1" [disabled]="!track()"
        [attr.aria-label]="seekLabel()" [attr.aria-valuetext]="elapsed() + ' of ' + total()" />
      <span class="w-10 tabular-nums">{{ total() }}</span>
    </div>
  </div>

  <!-- Right: volume etc -->
  <div class="hidden md:flex items-center gap-3 w-[30%] justify-end">
    <app-bluetooth-control />
    <button (click)="player.toggleQueuePanel()" title="Queue" aria-label="Queue"
      [attr.aria-pressed]="player.queueOpen()"
      [class]="player.queueOpen() ? 'text-[#1ed760]' : 'text-[#b3b3b3] hover:text-white'"
      class="relative transition">
      <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h10"/></svg>
      @if (player.queueOpen()) { <span class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-[#1ed760]"></span> }
    </button>
    <button (click)="player.toggleMute()" title="Mute"
      [class]="isMuted() || volume() === 0 ? 'text-red-500 hover:text-red-400' : 'text-[#b3b3b3] hover:text-white'">
      @if (isMuted() || volume() === 0) {
        <svg viewBox="0 0 24 24" class="w-4 h-4" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3 2.5-2.5-1.06-1.06L15.5 10.5l-2.5-2.5-1.06 1.06L14.44 12l-2.5 2.5 1.06 1.06 2.5-2.5 2.5 2.5 1.06-1.06L16.56 12l2.5-2.5z"/></svg>
      } @else {
        <svg viewBox="0 0 24 24" class="w-4 h-4" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      }
    </button>
    <input type="range" min="0" max="100" [value]="isMuted() ? 0 : volume()"
      [style.background]="volumeFill()" (input)="onVolume($event)" class="spot-range w-24" />
  </div>
</footer>
