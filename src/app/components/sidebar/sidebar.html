<aside class="hidden md:flex w-[300px] lg:w-[340px] shrink-0 flex-col gap-2 h-full">
  <!-- Nav -->
  <nav class="bg-[#121212] rounded-lg px-3 py-5 flex flex-col gap-1">
    <a routerLink="/" routerLinkActive="text-white" [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-5 px-3 py-2 text-sm font-bold text-[#b3b3b3] hover:text-white transition-colors">
      <svg viewBox="0 0 24 24" class="w-6 h-6" fill="currentColor"><path d="M12.5 3.247a1 1 0 0 0-1 1V1a1 1 0 0 0-1 1v3.378A9.75 9.75 0 0 0 2.25 15v.5a1 1 0 0 0 1 1h1.372l4.05-4.05a1 1 0 0 0-.49-1.705l-.142-.028a4 4 0 0 1 2.789-4.872l.53-.133a1 1 0 0 0 .64-.949V4.247a1 1 0 0 0-1-1h-1zm7 0a1 1 0 0 0-1 1V1a1 1 0 0 0-1 1v3.378a9.75 9.75 0 0 0-5.623 9.122c.003.125.006.25.012.375H18.5a1 1 0 0 0 1-1V15a9.75 9.75 0 0 0-8.25-9.753V4.247a1 1 0 0 0 1-1h1zM5 15.5A7.75 7.75 0 0 1 11.5 8.5v7a3.5 3.5 0 0 1-6.5 0z"/></svg>
      Home
    </a>
    <a routerLink="/search" routerLinkActive="text-white"
      class="flex items-center gap-5 px-3 py-2 text-sm font-bold text-[#b3b3b3] hover:text-white transition-colors">
      <svg viewBox="0 0 24 24" class="w-6 h-6" fill="currentColor"><path d="M7 1.75a5.25 5.25 0 1 0 0 10.5 5.25 5.25 0 0 0 0-10.5zM.25 7a6.75 6.75 0 1 1 12.096 4.12l3.535 3.536a.75.75 0 1 1-1.06 1.06l-3.536-3.535A6.75 6.75 0 0 1 .25 7z"/></svg>
      Search
    </a>
  </nav>

  <!-- Library -->
  <div class="bg-[#121212] rounded-lg flex-1 flex flex-col min-h-0">
    <div class="flex items-center justify-between px-4 pt-4 pb-2">
      <button class="flex items-center gap-3 text-[#b3b3b3] hover:text-white transition-colors font-bold text-sm">
        <svg viewBox="0 0 24 24" class="w-6 h-6" fill="currentColor"><path d="M14.5 2.134a1 1 0 0 1 1 0l6 3.464a1 1 0 0 1 .5.866V21a1 1 0 0 1-1 1h-6a1 1 0 0 1-1-1v-3h-2v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-6.197c0-.191.052-.378.15-.54l7.923-10.53a1 1 0 0 1 .85-.434h1.577zM14.5 9.866V4.65l-6.923 9.204V20h4v-3a1 1 0 0 1 1-1h2a1 1 0 0 1 1-1v-3h2V9.866h-3.5zM16 14h3v6h-3v-6z"/></svg>
        Your Library
      </button>
      <button title="Create playlist"
        class="w-8 h-8 rounded-full flex items-center justify-center text-[#b3b3b3] hover:text-white hover:bg-white/10 transition">
        <span class="text-2xl leading-none font-light">+</span>
      </button>
    </div>

    <div class="flex gap-2 px-4 pb-2">
      @for (f of filters; track f) {
        <button (click)="setFilter(f)"
          [class]="activeFilter() === f
            ? 'bg-white text-black'
            : 'bg-white/10 text-white hover:bg-white/20'"
          class="text-[13px] font-medium px-3 py-1.5 rounded-full transition-colors">
          {{ f }}
        </button>
      }
    </div>

    <div class="flex-1 overflow-y-auto px-2 pb-2">
      @for (p of playlists(); track p.id) {
        <a [routerLink]="['/playlist', p.id]"
          class="flex items-center gap-3 p-2 rounded-md hover:bg-white/10 transition-colors group">
          <div [class]="'w-12 h-12 rounded flex items-center justify-center text-2xl shrink-0 bg-gradient-to-br ' + p.gradient">
            {{ p.emoji }}
          </div>
          <div class="min-w-0">
            <p class="text-sm font-medium text-white truncate">{{ p.title }}</p>
            <p class="text-[13px] text-[#b3b3b3] truncate">Playlist • {{ p.likes }}</p>
          </div>
        </a>
      }

      <!-- Liked Songs pinned -->
      <a routerLink="/liked"
        class="flex items-center gap-3 p-2 rounded-md hover:bg-white/10 transition-colors">
        <div class="w-12 h-12 rounded flex items-center justify-center shrink-0 bg-gradient-to-br from-indigo-500 via-purple-500 to-slate-400">
          <svg viewBox="0 0 24 24" class="w-5 h-5 text-white" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
        <div class="min-w-0">
          <p class="text-sm font-medium text-white truncate">Liked Songs</p>
          <p class="text-[13px] text-[#b3b3b3] truncate">Playlist • 127 songs</p>
        </div>
      </a>
    </div>
  </div>
</aside>
