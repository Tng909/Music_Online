<div class="px-6 pb-10 max-w-2xl">
  <h1 class="text-2xl md:text-3xl font-extrabold mb-6">Account</h1>

  <!-- Profile summary -->
  <section class="flex items-center gap-4 rounded-lg bg-[#181818] hover:bg-[#242424] transition p-4 mb-4">
    <span class="w-16 h-16 shrink-0 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center font-extrabold text-xl">
      {{ initial() }}
    </span>
    <div class="min-w-0">
      <p class="text-lg font-extrabold truncate">{{ user()?.name }}</p>
      <p class="text-sm text-[#a7a7a7] truncate">{{ user()?.email ?? user()?.phone }}</p>
    </div>
  </section>

  <!-- Details -->
  <section class="rounded-lg bg-[#181818] p-4">
    <dl class="divide-y divide-white/10">
      <div class="flex items-center justify-between gap-4 py-3">
        <dt class="text-sm text-[#a7a7a7]">Name</dt>
        <dd class="text-sm font-bold truncate">{{ user()?.name }}</dd>
      </div>
      <div class="flex items-center justify-between gap-4 py-3">
        <dt class="text-sm text-[#a7a7a7]">Email</dt>
        <dd class="text-sm font-bold truncate">{{ user()?.email ?? '—' }}</dd>
      </div>
      <div class="flex items-center justify-between gap-4 py-3">
        <dt class="text-sm text-[#a7a7a7]">Phone</dt>
        <dd class="text-sm font-bold truncate">{{ user()?.phone ?? '—' }}</dd>
      </div>
      <div class="flex items-center justify-between gap-4 py-3">
        <dt class="text-sm text-[#a7a7a7]">Sign-in method</dt>
        <dd class="text-sm font-bold truncate">{{ providerLabel() }}</dd>
      </div>
      <div class="flex items-center justify-between gap-4 py-3">
        <dt class="text-sm text-[#a7a7a7]">Member since</dt>
        <dd class="text-sm font-bold truncate">{{ memberSince() }}</dd>
      </div>
    </dl>
  </section>

  <!-- Actions -->
  <div class="mt-6">
    <button type="button" (click)="logout()"
      class="rounded-full border border-white/40 px-6 py-3 text-sm font-bold hover:border-white hover:scale-105 transition-transform">
      Log out
    </button>
  </div>

  <p class="mt-4 text-xs text-[#a7a7a7]">
    Need a different account?
    <a routerLink="/signup" class="font-bold text-white hover:underline">Sign up</a>
  </p>
</div>
