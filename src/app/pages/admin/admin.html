<div class="flex min-h-full">
  <!-- Left tabs -->
  <aside class="w-48 sm:w-56 shrink-0 border-r border-white/10 p-3 sm:p-4 flex flex-col gap-1">
    <p class="px-2 pb-2 text-xs font-bold uppercase tracking-widest text-[#a7a7a7]">Management</p>
    @for (t of tabs; track t.id) {
      <button type="button" (click)="active.set(t.id)"
        [class]="active() === t.id ? 'bg-white/10 text-white' : 'text-[#b3b3b3] hover:text-white hover:bg-white/5'"
        class="flex items-center gap-3 rounded-md px-3 py-2.5 text-sm font-bold transition text-left">
        <span class="text-base w-5 text-center">{{ t.icon }}</span>
        {{ t.label }}
      </button>
    }
  </aside>

  <!-- Tab content -->
  <section class="flex-1 min-w-0 p-4 sm:p-6">
    <h1 class="text-2xl font-extrabold mb-5">{{ title() }}</h1>
    @switch (active()) {
      @case ('dashboard') { <app-admin-dashboard /> }
      @case ('songs') { <app-admin-songs /> }
      @case ('artists') { <app-admin-artists /> }
      @case ('albums') { <app-admin-albums /> }
      @case ('playlists') { <app-admin-playlists /> }
      @case ('accounts') { <app-admin-accounts /> }
      @case ('contacts') { <app-admin-contacts /> }
      @case ('history') { <app-admin-history /> }
    }
  </section>
</div>
