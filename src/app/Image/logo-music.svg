<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="MusicOnline icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#0f0a2e"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="140" height="140" rx="32" fill="url(#bg)"/>

  <!-- orbit, back half (behind record) -->
  <g transform="rotate(-25 70 70)" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <path d="M8 70 A62 22 0 0 1 132 70"/>
  </g>

  <!-- vinyl record -->
  <circle cx="70" cy="70" r="40" fill="#0b0720" stroke="#3b2a7a" stroke-width="2"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1.2">
    <circle cx="70" cy="70" r="34"/>
    <circle cx="70" cy="70" r="29"/>
    <circle cx="70" cy="70" r="24"/>
  </g>
  <path d="M70 70 L98 42 A40 40 0 0 1 106 62 Z" fill="#ffffff" opacity="0.07"/>

  <!-- label + note -->
  <circle cx="70" cy="70" r="18" fill="url(#g)"/>
  <g fill="#ffffff">
    <ellipse cx="65.5" cy="77" rx="5" ry="3.8" transform="rotate(-20 65.5 77)"/>
    <rect x="69" y="60" width="2.6" height="17" rx="1.3"/>
    <path d="M71.6 60 C77 61 79 65 77 70 C77 66 75 64 71.6 64 Z"/>
  </g>
  <circle cx="70" cy="70" r="2" fill="#0b0720" opacity="0.0"/>

  <!-- orbit, front half (in front of record) + online dot -->
  <g transform="rotate(-25 70 70)">
    <path d="M8 70 A62 22 0 0 0 132 70" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="106" cy="87" r="8" fill="#22c55e" stroke="#0f0a2e" stroke-width="4"/>
  </g>
</svg>
